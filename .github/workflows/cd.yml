name: CD

on:
  push:
    branches:
      - dev
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: "Target environment for manual run"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: bfs-life-backend
  FRONTEND_IMAGE_NAME: bfs-life-frontend

jobs:
  build-and-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    outputs:
      deploy_environment: ${{ steps.meta.outputs.deploy_environment }}
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
      image_version: ${{ steps.meta.outputs.image_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image owner
        id: owner
        shell: bash
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Resolve CD metadata
        id: meta
        shell: bash
        run: |
          BACKEND_IMAGE="${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ env.BACKEND_IMAGE_NAME }}"
          FRONTEND_IMAGE="${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ env.FRONTEND_IMAGE_NAME }}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            ENVIRONMENT="production"
            BACKEND_TAGS="${BACKEND_IMAGE}:${VERSION},${BACKEND_IMAGE}:latest"
            FRONTEND_TAGS="${FRONTEND_IMAGE}:${VERSION},${FRONTEND_IMAGE}:latest"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.deploy_environment }}" == "production" ]]; then
            VERSION="manual-${GITHUB_SHA::7}"
            ENVIRONMENT="production"
            BACKEND_TAGS="${BACKEND_IMAGE}:${VERSION},${BACKEND_IMAGE}:latest"
            FRONTEND_TAGS="${FRONTEND_IMAGE}:${VERSION},${FRONTEND_IMAGE}:latest"
          else
            VERSION="staging-${GITHUB_SHA::7}"
            ENVIRONMENT="staging"
            BACKEND_TAGS="${BACKEND_IMAGE}:staging,${BACKEND_IMAGE}:${VERSION}"
            FRONTEND_TAGS="${FRONTEND_IMAGE}:staging,${FRONTEND_IMAGE}:${VERSION}"
          fi

          echo "backend_image=${BACKEND_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${FRONTEND_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "backend_tags=${BACKEND_TAGS}" >> "$GITHUB_OUTPUT"
          echo "frontend_tags=${FRONTEND_TAGS}" >> "$GITHUB_OUTPUT"
          echo "deploy_environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "image_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.backend_tags }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile.prod
          push: true
          build-args: |
            VITE_API_URL=/api/v1
          tags: ${{ steps.meta.outputs.frontend_tags }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: needs.build-and-push.outputs.deploy_environment == 'staging' && vars.ENABLE_STAGING_DEPLOY == 'true'
    environment: staging

    steps:
      - name: Deploy staging over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd ${{ vars.STAGING_APP_DIR || '~/BFS_Life_OOA' }}
            export BACKEND_IMAGE=${{ needs.build-and-push.outputs.backend_image }}:staging
            export FRONTEND_IMAGE=${{ needs.build-and-push.outputs.frontend_image }}:staging
            docker compose \
              --env-file .env \
              -f infra/docker/docker-compose.staging.yml \
              pull
            docker compose \
              --env-file .env \
              -f infra/docker/docker-compose.staging.yml \
              up -d --remove-orphans
            docker image prune -f

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: needs.build-and-push.outputs.deploy_environment == 'production' && vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    environment: production

    steps:
      - name: Deploy production over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -e
            cd ${{ vars.PRODUCTION_APP_DIR || '~/BFS_Life_OOA' }}
            export BACKEND_IMAGE=${{ needs.build-and-push.outputs.backend_image }}:${{ needs.build-and-push.outputs.image_version }}
            export FRONTEND_IMAGE=${{ needs.build-and-push.outputs.frontend_image }}:${{ needs.build-and-push.outputs.image_version }}
            docker compose \
              --env-file .env \
              -f infra/docker/docker-compose.production.yml \
              pull
            docker compose \
              --env-file .env \
              -f infra/docker/docker-compose.production.yml \
              up -d --remove-orphans
            docker image prune -f
