services:
  db:
    image: postgres:16
    container_name: bfs_db_production
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-bfs}
    volumes:
      - bfs_production_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bfs}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/namorone/bfs-life-backend:latest}
    container_name: bfs_backend_production
    restart: always
    environment:
      PYTHONPATH: /app
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/bfs}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/bfs}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://example.com}
      MEDIA_ROOT: ${MEDIA_ROOT:-/app/media}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - bfs_production_media:/app/media
    command: >
      sh -c "
      until pg_isready -h db -p 5432 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bfs}; do
        echo 'Waiting for database...';
        sleep 2;
      done;
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/namorone/bfs-life-frontend:latest}
    container_name: bfs_frontend_production
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  bfs_production_db_data:
  bfs_production_media: